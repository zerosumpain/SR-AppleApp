name: sr-appleapp
services:
  apple-app:
    build:
      context: ..
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS origin for the companion}
      DATABASE_PATH: /app/data/apple.sqlite
      # The main site's Auth.js secret. Browsers sign in with the site's own
      # Google session and this is how that cookie is verified; the container
      # refuses to start on an https origin without it. DEMO_MODE is
      # deliberately not set here — it only works on a non-https origin anyway.
      AUTH_SECRET: ${AUTH_SECRET:?Copy AUTH_SECRET from the main site's environment}
      # The service lane /health reads the owner's journeys through — see
      # docs/INTEGRATION.md. Both empty = the endpoint 404s, which is the right
      # state for anywhere that has not opted in. The token is shared with
      # SR-Health's COMPANION_SERVICE_TOKEN; the owner is an email in `users`.
      APPLE_SERVICE_TOKEN: ${APPLE_SERVICE_TOKEN:-}
      APPLE_SERVICE_OWNER: ${APPLE_SERVICE_OWNER:-}
      # The household lane SR-Main's /home/people pulls the family's fixes
      # through, and pushes arrive/leave alerts into. Its OWN secret (shared
      # with SR-Main's COMPANION_HOUSEHOLD_TOKEN), never APPLE_SERVICE_TOKEN;
      # empty = both household endpoints 404.
      APPLE_HOUSEHOLD_TOKEN: ${APPLE_HOUSEHOLD_TOKEN:-}
      # /health's doorbell (spec E2): rung after each owner upload so /health
      # pulls the export at once. Empty = no ring; /health still catches up on
      # its page-load backstop. APPLE_DOORBELL_TOKEN is its OWN ring-only
      # secret, never APPLE_SERVICE_TOKEN above — it can only trigger a pull
      # and grants no read access, unlike the service token.
      APPLE_DOORBELL_URL: ${APPLE_DOORBELL_URL:-}
      APPLE_DOORBELL_TOKEN: ${APPLE_DOORBELL_TOKEN:-}
    ports:
      - '127.0.0.1:5295:5295'
    volumes:
      - apple_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5295/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  apple_data:

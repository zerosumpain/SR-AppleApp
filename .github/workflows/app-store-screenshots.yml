name: App Store screenshots

# By hand, when the listing needs new pictures. `AppStoreShotsTests` — eight
# screens, each asserted before it is shot — on the largest iPhone simulator
# (the 6.9-inch set App Store Connect asks for), with a clean status bar.
# Light only: the app is light-locked. See docs/APP-STORE.md §7.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml
      - name: Shoot
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); xs=[x for g in d["devices"].values() for x in g if x["name"].startswith("iPhone") and "Pro Max" in x["name"]]; print(sorted(xs, key=lambda x: x["name"])[-1]["udid"])')
          xcrun simctl list devices available | grep "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcodebuild test -parallel-testing-enabled NO -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData \
            -only-testing:SRAppleAppUITests/AppStoreShotsTests \
            -resultBundlePath artifacts/Store.xcresult CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Export screenshots
        if: always()
        run: |
          if [ -d artifacts/Store.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/Store.xcresult --output-path artifacts/attachments
          fi
      # "Store 03 — Steps leaderboard" -> artifacts/store/03-steps-leaderboard.png,
      # by the suggested names in the export's manifest.json.
      - name: Name the store set
        if: always()
        run: |
          mkdir -p artifacts/store
          [ -f artifacts/attachments/manifest.json ] || exit 0
          python3 - <<'PY'
          import json, re, shutil, os
          src = 'artifacts/attachments'
          for test in json.load(open(os.path.join(src, 'manifest.json'))):
              for a in test.get('attachments', []):
                  name = a.get('suggestedHumanReadableName', '')
                  m = re.match(r'Store (\d+)\s*\S\s*(.+?)(?:_\d+)?(?:_[0-9A-Fa-f-]{36})?\.\w+$', name)
                  if not m:
                      continue
                  slug = re.sub(r'[^a-z0-9]+', '-', m.group(2).lower()).strip('-')
                  out = f'artifacts/store/{m.group(1)}-{slug}.png'
                  shutil.copy(os.path.join(src, a['exportedFileName']), out)
                  print(name, '->', out)
          PY
          ls -l artifacts/store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: artifacts/store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-shots-raw
          path: artifacts/attachments

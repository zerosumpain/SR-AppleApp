name: Check app and API
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm test
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Apple toolchain
        run: |
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml
      - name: Build and test on iPhone simulator
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild test -parallel-testing-enabled NO -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData -resultBundlePath artifacts/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d artifacts/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/Tests.xcresult --output-path artifacts/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: |
            build.log
            artifacts/Tests.xcresult
            artifacts/screenshots
            DerivedData/Build/Products/Debug-iphonesimulator/SRAppleApp.app
          retention-days: 7

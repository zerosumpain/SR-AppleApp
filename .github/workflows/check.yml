name: Check app and API
#
# The `ios` job runs on macOS, which GitHub bills at a 10x minute multiplier and
# which takes ~20 minutes cold. On 2026-09-22 this workflow ran on every push to
# every branch, so four Mac builds went in an hour and the account hit its Actions
# spending limit — after which jobs fail in under ten seconds, before a single
# step, and no amount of re-running helps.
#
# Two changes:
#
#  1. Branch pushes no longer trigger anything. A branch is checked when it opens
#     a pull request and when `main` moves, not on every commit while working.
#  2. The Mac job is skipped entirely unless the change TOUCHES `ios/`. This one
#     is the smaller saving and it is worth being honest about that: every
#     commit on 2026-09-22 happened to carry Swift alongside its server changes,
#     so the filter would have saved nothing that day. It pays off on the
#     server-and-docs commits this repo also gets, and it costs one cheap ubuntu
#     job to decide.
#
# The first change is the one that mattered: three of the four Mac builds that
# day were branch pushes on work that was not ready to be checked yet, and two of
# those were superseded minutes later by the next push.
#
# By 2026-10-01 a green Mac job took ~85 minutes, and a change paid it twice:
# once on its pull request and again when it merged. Of those 85, 57 were the UI
# suite run serially, and 43 of THOSE were `ShowcaseTests` and
# `AppStoreShotsTests` — screenshot walks whose lookups are soft, so they cannot
# fail a change, only photograph it. Hence, on 2026-10-02:
#
#  3. The screenshot walks moved out (`showcase.yml`, `app-store-screenshots.yml`).
#  4. A merged pull request is not rebuilt on `main`: its own check already ran
#     on the merge commit, and `testflight.yml` archives Release on every merge.
#     A push straight to `main` with no pull request still gets the full job.
#  5. The Release build is its own job beside the simulator one, not after it,
#     and the simulator boots while the app compiles.
#
# The cheap `api` job is unchanged and still runs every time: it is an
# ubuntu runner at the 1x rate and it is the faster signal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Decide whether the expensive jobs have anything to do. Plain git rather than a
  # third-party paths-filter action — this repo pulls in only `actions/*`, and a
  # diff is two lines.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To ask which pull request a commit on `main` came from.
      pull-requests: read
    outputs:
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Does this change touch the iPhone app?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
          elif [ "$EVENT" = 'push' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            BASE='${{ github.event.before }}'
            HEAD='${{ github.sha }}'
          else
            # A manual run, or a first push with no `before` to diff against.
            # FAIL OPEN: building something that did not need it costs minutes,
            # skipping something that did costs a broken app nobody checked.
            echo 'Cannot diff this event — building anyway.'
            echo 'ios=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $BASE..$HEAD"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$CHANGED"
          # The workflow itself counts: a change to how the app is built must be
          # proved by building the app.
          if ! printf '%s\n' "$CHANGED" | grep -qE '^(ios/|\.github/workflows/check\.yml$)'; then
            echo 'No iOS sources touched — skipping the simulator build.'
            echo 'ios=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A merge of a pull request was checked as that pull request, on the
          # same merge commit unless `main` moved meanwhile, and the TestFlight
          # archive compiles it again in Release. Anything else on `main` — a
          # direct push, or a lookup that fails — FAILS OPEN and builds.
          if [ "$EVENT" = 'push' ]; then
            MERGED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/pulls" --jq '[.[] | select(.merged_at != null) | .number] | join(",")' || true)"
            if [ -n "$MERGED" ]; then
              echo "Merged from #$MERGED, already checked there — skipping the simulator build."
              echo 'ios=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'ios=true' >> "$GITHUB_OUTPUT"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm test
      # A grep, on the 1x runner, for the one rule the 10x runner cannot check:
      # a bundled face asked for at a fixed size compiles perfectly and renders
      # perfectly, and simply never answers the reader's text setting.
      - run: node scripts/check-dynamic-type.mjs
      # App Store Connect bounces a build whose Siri metadata names an Apple
      # product (ITMS-90626) — and only says so by email, hours later.
      - run: node scripts/check-intent-metadata.mjs
      # A bare `.refreshable` is cancelled by the redraw its own store causes.
      - run: node scripts/check-refreshable.mjs
      # The macOS job builds DEBUG; the TestFlight archive is RELEASE, where the
      # demo harness does not exist. An unguarded reference is green here and
      # fails only at upload.
      - run: node scripts/check-demo-guard.mjs
  ios:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-26
    # Was 110, when this job also ran the screenshot walks (~43 min) and the
    # Release build (~11) and a green run took ~85. Without them a green run is
    # ~25. A timeout is for a wedged simulator, not the suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Apple toolchain
        run: |
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml
      # A cold simulator takes ~4 minutes to boot (its data migration alone is
      # ~1), and nothing needs it until the tests. Boot it now, in the
      # background, so that happens while the app compiles.
      - name: Start booting the iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          nohup sh -c "xcrun simctl boot '$DEVICE_ID' || true; xcrun simctl bootstatus '$DEVICE_ID' -b" > boot.log 2>&1 &
      # The iPhone app embeds the Watch app, so the test step below builds it
      # too; this step builds it on its own first, so a Watch compile error is
      # reported as one rather than as a failed iPhone test run. Xcode ships
      # platforms separately: if this image lacks watchOS, fetch it once.
      - name: Build the Watch app
        run: |
          set -o pipefail
          if ! xcodebuild -showsdks | grep -q watchsimulator; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build -project ios/SRAppleApp.xcodeproj -scheme SRAppleWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO | tee watch-build.log
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO | tee build.log
      # `ShowcaseTests` and `AppStoreShotsTests` walk the app to photograph it:
      # ~43 minutes, and Showcase's lookups are soft, so they cannot fail a
      # change. They run in `showcase.yml` and `app-store-screenshots.yml`.
      - name: Test on iPhone simulator
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcodebuild test-without-building -parallel-testing-enabled NO -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData -resultBundlePath artifacts/Tests.xcresult \
            -skip-testing:SRAppleAppUITests/ShowcaseTests -skip-testing:SRAppleAppUITests/AppStoreShotsTests | tee test.log
      - name: Export simulator screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -d artifacts/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/Tests.xcresult --output-path artifacts/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-simulator-results
          path: |
            boot.log
            build.log
            test.log
            watch-build.log
            artifacts/Tests.xcresult
            artifacts/screenshots
            DerivedData/Build/Products/Debug-iphonesimulator/SRAppleApp.app
          retention-days: 7
  # The TestFlight archive builds RELEASE; everything above is Debug. The
  # App Review demo runs on fixtures that compile in both, and a reference
  # that exists only in Debug is green above and fails at upload (the
  # Health hub, #29). So compile exactly what the archive compiles — for
  # the simulator, unsigned: the configuration is the point, not the device.
  # Its own runner, beside `ios` rather than after it: ~11 minutes off the
  # wait for the same Mac minutes.
  release:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml
      - name: Build Release (what TestFlight archives)
        run: |
          set -o pipefail
          if ! xcodebuild -showsdks | grep -q watchsimulator; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO | tee release-build.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-release-build-log
          path: release-build.log
          retention-days: 7

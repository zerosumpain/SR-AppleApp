name: Check app and API
#
# The `ios` job runs on macOS, which GitHub bills at a 10x minute multiplier and
# which takes ~20 minutes cold. On 2026-09-22 this workflow ran on every push to
# every branch, so four Mac builds went in an hour and the account hit its Actions
# spending limit — after which jobs fail in under ten seconds, before a single
# step, and no amount of re-running helps.
#
# Two changes:
#
#  1. Branch pushes no longer trigger anything. A branch is checked when it opens
#     a pull request and when `main` moves, not on every commit while working.
#  2. The Mac job is skipped entirely unless the change TOUCHES `ios/`. This one
#     is the smaller saving and it is worth being honest about that: every
#     commit on 2026-09-22 happened to carry Swift alongside its server changes,
#     so the filter would have saved nothing that day. It pays off on the
#     server-and-docs commits this repo also gets, and it costs one cheap ubuntu
#     job to decide.
#
# The first change is the one that mattered: three of the four Mac builds that
# day were branch pushes on work that was not ready to be checked yet, and two of
# those were superseded minutes later by the next push.
#
# The cheap `api` job is unchanged and still runs every time: it is an
# ubuntu runner at the 1x rate and it is the faster signal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Decide whether the expensive job has anything to do. Plain git rather than a
  # third-party paths-filter action — this repo pulls in only `actions/*`, and a
  # diff is two lines.
  scope:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Does this change touch the iPhone app?
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
          elif [ "$EVENT" = 'push' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            BASE='${{ github.event.before }}'
            HEAD='${{ github.sha }}'
          else
            # A manual run, or a first push with no `before` to diff against.
            # FAIL OPEN: building something that did not need it costs minutes,
            # skipping something that did costs a broken app nobody checked.
            echo 'Cannot diff this event — building anyway.'
            echo 'ios=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $BASE..$HEAD"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$CHANGED"
          # The workflow itself counts: a change to how the app is built must be
          # proved by building the app.
          if printf '%s\n' "$CHANGED" | grep -qE '^(ios/|\.github/workflows/check\.yml$)'; then
            echo 'ios=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No iOS sources touched — skipping the simulator build.'
            echo 'ios=false' >> "$GITHUB_OUTPUT"
          fi

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm test
      # A grep, on the 1x runner, for the one rule the 10x runner cannot check:
      # a bundled face asked for at a fixed size compiles perfectly and renders
      # perfectly, and simply never answers the reader's text setting.
      - run: node scripts/check-dynamic-type.mjs
      # App Store Connect bounces a build whose Siri metadata names an Apple
      # product (ITMS-90626) — and only says so by email, hours later.
      - run: node scripts/check-intent-metadata.mjs
      # A bare `.refreshable` is cancelled by the redraw its own store causes.
      - run: node scripts/check-refreshable.mjs
      # The macOS job builds DEBUG; the TestFlight archive is RELEASE, where the
      # demo harness does not exist. An unguarded reference is green here and
      # fails only at upload.
      - run: node scripts/check-demo-guard.mjs
  # ---------------------------------------------------------------------------
  # The iPhone app: build once, test in three shards at once, Release alongside.
  #
  # Was one job, and every step waited on the one before: the Debug build
  # (~12 min), every test one after another (~66 min, 47 of them the
  # screenshot-only ShowcaseTests), then a Release build for BOTH simulator
  # architectures (~13 min) — ~96 min a run, against a 110-minute timeout.
  #
  # Now `ios-build` compiles the app and its test bundles once
  # (`build-for-testing`) and hands them on; three `ios-test` shards each run a
  # third of the suite against that same build (`test-without-building`) on
  # their own runner, while `ios-release` compiles Release for arm64 only (the
  # simulator the runners have; an x86_64 slice proves nothing extra). Wall
  # time is the build plus the longest shard, ~40 min. Mac minutes stay about
  # the same: the tests are split, not repeated, and each extra runner costs a
  # couple of minutes to start.
  #
  # `ios` at the end is the one status to read, as before.
  # ---------------------------------------------------------------------------
  ios-build:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Apple toolchain
        run: |
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml
      # MapLibre is a binary package: fetching it is network time every run.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/app.yml', 'ios/watch.yml', 'ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      # The iPhone app embeds the Watch app, so the build below builds it too;
      # this builds it on its own first, so a Watch compile error is reported as
      # one rather than as a failed iPhone build. Xcode ships platforms
      # separately: if this image lacks watchOS, fetch it once.
      - name: Build the Watch app
        run: |
          set -o pipefail
          if ! xcodebuild -showsdks | grep -q watchsimulator; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build -project ios/SRAppleApp.xcodeproj -scheme SRAppleWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | tee watch-build.log
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | tee build.log
      # Tarred: upload-artifact drops file modes, and an app whose binary has
      # lost its executable bit installs and then will not launch.
      - name: Pack the build
        run: tar -cf products.tar -C DerivedData/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-products
          path: products.tar
          compression-level: 1
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-build-logs
          path: |
            build.log
            watch-build.log
          retention-days: 7

  ios-test:
    needs: [scope, ios-build]
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-26
    # A shard runs ~20-25 min. A timeout is for a wedged simulator, not the suite.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # The unit tests and every UI test that asserts: onboarding, chat,
          # health, the review demo, the App Store set.
          - shard: behaviour
            select: -skip-testing:SRAppleAppUITests/ShowcaseTests
          # The game walks: the four longest showcases are here (~3 min each).
          - shard: showcase-games
            select: >-
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseGames
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseWordleRace
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseQuizNight
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseAnagramSprintMemory
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseBoggle
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseCategories
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseLiarsDice
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseDrawGuess
              -only-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseGameLeaderboard
          # Every other showcase, by SKIPPING the games rather than listing the
          # rest: a showcase added later lands here, never in no shard at all.
          - shard: showcase-screens
            select: >-
              -only-testing:SRAppleAppUITests/ShowcaseTests
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseGames
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseWordleRace
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseQuizNight
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseAnagramSprintMemory
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseBoggle
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseCategories
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseLiarsDice
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseDrawGuess
              -skip-testing:SRAppleAppUITests/ShowcaseTests/testShowcaseGameLeaderboard
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-products
      - name: Unpack the build
        run: |
          mkdir -p DerivedData/Build
          tar -xf products.tar -C DerivedData/Build
          ls DerivedData/Build/Products
      - name: Test (${{ matrix.shard }})
        run: |
          set -o pipefail
          XCTESTRUN=$(ls DerivedData/Build/Products/*.xctestrun | head -1)
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcodebuild test-without-building -parallel-testing-enabled NO -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath "artifacts/Tests-${{ matrix.shard }}.xcresult" ${{ matrix.select }} | tee test.log
      - name: Export simulator screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -d "artifacts/Tests-${{ matrix.shard }}.xcresult" ]; then
            xcrun xcresulttool export attachments --path "artifacts/Tests-${{ matrix.shard }}.xcresult" --output-path artifacts/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-results-${{ matrix.shard }}
          path: |
            test.log
            artifacts
          retention-days: 7

  # The TestFlight archive builds RELEASE; the tests run Debug. The App Review
  # demo runs on fixtures that compile in both, and a reference that exists only
  # in Debug is green in the tests and fails at upload (the Health hub, #29). So
  # compile exactly what the archive compiles — for the simulator, unsigned: the
  # configuration is the point, not the device. Alongside the tests, not after.
  ios-release:
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/app.yml', 'ios/watch.yml', 'ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build Release (what TestFlight archives)
        run: |
          set -o pipefail
          if ! xcodebuild -showsdks | grep -q watchsimulator; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | tee release-build.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-release-log
          path: release-build.log
          retention-days: 7

  # The one status to read: green only when the build, every shard and the
  # Release build are. Skipped (and so not red) when the change does not touch
  # the iPhone app.
  ios:
    needs: [scope, ios-build, ios-test, ios-release]
    if: ${{ always() && needs.scope.outputs.ios == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every iPhone job passed
        run: |
          echo "build:   ${{ needs.ios-build.result }}"
          echo "tests:   ${{ needs.ios-test.result }}"
          echo "release: ${{ needs.ios-release.result }}"
          test "${{ needs.ios-build.result }}" = success
          test "${{ needs.ios-test.result }}" = success
          test "${{ needs.ios-release.result }}" = success

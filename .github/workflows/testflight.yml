name: Upload to TestFlight
# On every merge that changes what the app is built from — the pull request's
# check already passed — and by hand for anything else. Every upload until
# 2026-10-02 was a hand dispatch minutes after a merge, so the trigger only
# removes the wait for someone to press it. This archive is also the Release
# compile of `main`: `check.yml` does not rebuild a merged pull request.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      # Bundled into the app (`ios/app.yml`).
      - 'server/health-catalogue.json'
      - 'scripts/install-signing.sh'
      - 'scripts/asc-watch-profiles.py'
      - 'scripts/asc-adhoc.py'
      - 'scripts/publish-adhoc.sh'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify a signed archive without uploading to TestFlight'
        type: boolean
        default: false
      # The ad-hoc copy (scripts/asc-adhoc.py) is exported beside every upload,
      # for phones that cannot use TestFlight. SR-Main's /install enrolment
      # dispatches this with testflight off and the phone's UDID.
      testflight:
        description: 'Upload to TestFlight (off = the ad-hoc copy only)'
        type: boolean
        default: true
      adhoc_udid:
        description: 'Add this phone to the ad-hoc copy (its UDID)'
        type: string
        default: ''
      adhoc_name:
        description: "That phone's name on the developer account, e.g. Rory's iPhone"
        type: string
        default: ''
permissions:
  contents: read
# Merges close together upload in turn, and an upload in progress is never cut
# off; GitHub keeps only the newest one waiting, which is the one worth having.
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 40
    # Write, for the ad-hoc copy's draft release only (scripts/publish-adhoc.sh).
    permissions:
      contents: write
    env:
      VERIFY_ONLY: ${{ inputs.verify_only }}
      UPLOAD: ${{ inputs.testflight }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
      DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
      PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
      # The Watch app's and its complications' App Store profiles. Until both
      # exist the upload is the iPhone app alone, exactly as before the Watch.
      WATCH_PROVISION_PROFILE_BASE64: ${{ secrets.WATCH_PROVISION_PROFILE_BASE64 }}
      WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISION_PROFILE_BASE64 }}
    steps:
      # Before anything can print it. Read from the event payload, not an
      # `env:` block: a step's env is printed in its log header, and these
      # logs are public.
      - name: Mask the phone's UDID
        run: |
          UDID=$(jq -r '.inputs.adhoc_udid // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$UDID" ]; then
            echo "::add-mask::$UDID"
            echo "::add-mask::$(printf '%s' "$UDID" | tr '[:lower:]' '[:upper:]')"
          fi
      - uses: actions/checkout@v4
      - name: Verify current Apple toolchain
        run: |
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26
      - name: Check signing configuration
        run: |
          for name in APPLE_TEAM_ID BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY DISTRIBUTION_P12_BASE64 DISTRIBUTION_P12_PASSWORD PROVISION_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "Missing signing setting: $name"; exit 1; fi
          done
      - run: brew install xcodegen
      # The Watch app's two profiles, made by Apple through the API key above,
      # so nobody has to make, convert and paste them by hand. Never fails the
      # job: without them the upload is the iPhone app alone, with a warning
      # saying what to fix. Secrets, when set, win. See docs/WATCH-SETUP.md.
      - name: Get the Watch profiles from Apple
        run: python3 scripts/asc-watch-profiles.py
      - name: Install signing material
        run: bash scripts/install-signing.sh
      - name: Archive and upload
        run: |
          set -o pipefail
          if [ -n "${WATCH_PROFILE_UUID:-}" ] && [ -n "${WIDGET_PROFILE_UUID:-}" ] && [ -n "${LIVE_PROFILE_UUID:-}" ] && [ -n "${SHARE_PROFILE_UUID:-}" ]; then
            # Five targets, five profiles: each target names its own through
            # SR_*_PROFILE, and every bundle ID derives from SR_BUNDLE_ID. A
            # single PROVISIONING_PROFILE_SPECIFIER or PRODUCT_BUNDLE_IDENTIFIER
            # on this line would apply to all three and fail the archive.
            xcodegen generate --spec ios/project.yml
            xcodebuild archive -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SRAppleApp.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" SR_BUNDLE_ID="$BUNDLE_ID" MARKETING_VERSION="0.1.$GITHUB_RUN_NUMBER" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" SR_COMMIT="$GITHUB_SHA" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' SR_APP_PROFILE="$PROFILE_UUID" SR_WATCH_PROFILE="$WATCH_PROFILE_UUID" SR_WIDGET_PROFILE="$WIDGET_PROFILE_UUID" SR_LIVE_PROFILE="$LIVE_PROFILE_UUID" SR_SHARE_PROFILE="$SHARE_PROFILE_UUID"
          else
            echo "::warning::No Watch / Live Activity / share extension provisioning profiles: uploading the iPhone app without the Watch app, the family-journey Live Activity or Share to SR. See docs/WATCH.md."
            xcodegen generate --spec ios/app.yml
            xcodebuild archive -project ios/SRAppleApp.xcodeproj -scheme SRAppleApp -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SRAppleApp.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" MARKETING_VERSION="0.1.$GITHUB_RUN_NUMBER" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" SR_COMMIT="$GITHUB_SHA" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
          fi
          apps=("$RUNNER_TEMP"/SRAppleApp.xcarchive/Products/Applications/*.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          if [ "$VERIFY_ONLY" != 'true' ] && [ "$UPLOAD" != 'false' ]; then
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SRAppleApp.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          fi
      # Never costs the TestFlight upload: on a merge, or a dispatch that also
      # uploads, a failure here is a warning. Dispatched for the ad-hoc copy
      # alone, it is the whole point, so it fails the run.
      - name: Ad-hoc copy
        if: ${{ inputs.verify_only != true }}
        continue-on-error: ${{ github.event_name == 'push' || inputs.testflight }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/asc-adhoc.py
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SRAppleApp.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-adhoc.plist" -exportPath "$RUNNER_TEMP/adhoc"
          ipas=("$RUNNER_TEMP"/adhoc/*.ipa)
          test "${#ipas[@]}" -eq 1
          mv "${ipas[0]}" "$RUNNER_TEMP/SRAppleApp.ipa"
          bash scripts/publish-adhoc.sh "$RUNNER_TEMP/SRAppleApp.ipa" "$RUNNER_TEMP/build.json"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/*.mobileprovision
          for UUID in "${WATCH_PROFILE_UUID:-}" "${WIDGET_PROFILE_UUID:-}" "${LIVE_PROFILE_UUID:-}" "${SHARE_PROFILE_UUID:-}"; do
            if [ -n "$UUID" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"; fi
          done
          if [ -f "$RUNNER_TEMP/adhoc-profile-uuids" ]; then
            while read -r UUID; do rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"; done < "$RUNNER_TEMP/adhoc-profile-uuids"
          fi
          rm -rf "$RUNNER_TEMP/adhoc" "$RUNNER_TEMP/SRAppleApp.ipa"
          if [ -n "$PROFILE_UUID" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi

# The Watch app and its complications, and the iPhone's Live Activity
# extension, added to the iPhone app by `project.yml`. See docs/WATCH.md for
# what each Watch target is and why it holds no credential of its own. All
# three are signed with profiles CI mints through the App Store Connect API
# (scripts/asc-watch-profiles.py), which is why they travel together.
targets:
  SRAppleApp:
    # Embedded the way Xcode's own template embeds a single-target watch app:
    # in the products directory under `Watch/`.
    dependencies:
      - target: SRAppleWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
      # The family journey on the Lock Screen and in the Dynamic Island. An
      # app extension embeds in PlugIns/, the default for its type.
      - target: SRAppleLive
        embed: true
        codeSign: true

  SRAppleWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - SRAppleWatch
      - Shared
      # Two faces, not the phone's nine: figures and labels.
      - path: SRAppleApp/Fonts/InterDisplay-ExtraBold.ttf
        buildPhase: resources
      - path: SRAppleApp/Fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: SRAppleApp/Fonts/JetBrainsMono-Medium.ttf
        buildPhase: resources
    dependencies:
      - target: SRAppleWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_ID).watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: $(SR_WATCH_PROFILE)
        INFOPLIST_FILE: SRAppleWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: SRAppleWatch/SRAppleWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    scheme: {}

  SRAppleWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - SRAppleWatchWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_ID).watchkitapp.complications
        PROVISIONING_PROFILE_SPECIFIER: $(SR_WIDGET_PROFILE)
        INFOPLIST_FILE: SRAppleWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SRAppleWatchWidgets/SRAppleWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES

  SRAppleLive:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - SRAppleLive
      # The activity's shape, shared with the app that reports its tokens.
      - path: SRAppleApp/Journey/JourneyAttributes.swift
      # The family widgets' boards, rules, Keychain shelf and faces, shared
      # with the app that fills them.
      - path: SRAppleApp/Family/FamilyBoardModels.swift
      - path: SRAppleApp/Family/FamilyWidgetShared.swift
      # The headline and label faces, as on the Watch.
      - path: SRAppleApp/Fonts/InterDisplay-ExtraBold.ttf
        buildPhase: resources
      - path: SRAppleApp/Fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: SRAppleApp/Fonts/JetBrainsMono-Medium.ttf
        buildPhase: resources
      # Names on the family widgets.
      - path: SRAppleApp/Fonts/DMSans-Medium.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_ID).live
        PROVISIONING_PROFILE_SPECIFIER: $(SR_LIVE_PROFILE)
        INFOPLIST_FILE: SRAppleLive/Info.plist
        # One Keychain ACCESS group shared with the app, for the family
        # widgets. Not an App Group: every profile already allows
        # `<TEAM>.*` Keychain groups, so this needs no portal change.
        CODE_SIGN_ENTITLEMENTS: SRAppleLive/SRAppleLive.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        SKIP_INSTALL: YES

# The Watch app and its complications, added to the iPhone app by
# `project.yml`. See docs/WATCH.md for what each is and why it holds no
# credential of its own.
targets:
  SRAppleApp:
    # Embedded the way Xcode's own template embeds a single-target watch app:
    # in the products directory under `Watch/`.
    dependencies:
      - target: SRAppleWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  SRAppleWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - SRAppleWatch
      - Shared
      # Two faces, not the phone's nine: figures and labels.
      - path: SRAppleApp/Fonts/ArchivoBlack-Regular.ttf
        buildPhase: resources
      - path: SRAppleApp/Fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: SRAppleApp/Fonts/JetBrainsMono-Medium.ttf
        buildPhase: resources
    dependencies:
      - target: SRAppleWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_ID).watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: $(SR_WATCH_PROFILE)
        INFOPLIST_FILE: SRAppleWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: SRAppleWatch/SRAppleWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    scheme: {}

  SRAppleWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - SRAppleWatchWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_ID).watchkitapp.complications
        PROVISIONING_PROFILE_SPECIFIER: $(SR_WIDGET_PROFILE)
        INFOPLIST_FILE: SRAppleWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: SRAppleWatchWidgets/SRAppleWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
